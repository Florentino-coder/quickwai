<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>QuickWai - Florentino356</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="panel">
  <div id="banner" class="banner off"></div>

  <input id="pq" type="text" placeholder="ค้นหา Reply">
  <div id="plist"></div>

  <div id="nameStep" class="step" hidden>
    <b id="nameTitle"></b>
    <input id="nameInput" type="text" placeholder="ชื่อลูกค้า">
    <span class="muted">พิมพ์ชื่อแล้ว Enter หรือ Enter ว่างเพื่อวางแบบไม่มีชื่อ</span>
  </div>

  <div id="imageStep" class="step" hidden>
    <b id="imageTitle"></b>
    <div class="pick" id="imagePick"></div>
  </div>

  <div id="hint" class="hint"></div>

  <script src="shared.js"></script>
  <script src="panel.js"></script>
</body>
</html>
