<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>QuickWai - Florentino356</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="panel">
  <div id="banner" class="banner off"></div>

  <input id="pq" type="text" placeholder="ค้นหา Reply">
  <div id="plist"></div>

  <div id="setStep" class="split" hidden>
    <div class="side">
      <b id="setTitle"></b>
      <div id="setList" tabindex="-1"></div>
    </div>
    <div id="setPreview" class="preview"></div>
  </div>

  <div id="imageStep" class="step" hidden>
    <b id="imageTitle"></b>
    <div class="pick" id="imagePick"></div>
  </div>

  <div id="hint" class="hint"></div>

  <script src="shared.js"></script>
  <script src="panel.js"></script>
</body>
</html>
