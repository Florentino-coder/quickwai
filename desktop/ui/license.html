<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>QuickReply</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="step">
    <h2 style="margin:0">ใส่โค้ดใช้งาน</h2>
    <div class="machine">
      <span class="muted">1. คัดลอกรหัสเครื่องนี้ ส่งให้ผู้ดูแลพร้อมชื่อของคุณ</span>
      <div><kbd id="machine"></kbd> <button id="copyMachine">คัดลอกรหัสเครื่อง</button> <span id="copied" class="muted"></span></div>
    </div>
    <span class="muted">2. วางโค้ดที่ผู้ดูแลส่งกลับมา</span>
    <textarea id="code" placeholder="QR1...." style="min-height:100px" autofocus></textarea>
    <div id="error" class="banner warn" hidden></div>
    <div class="actions">
      <button id="quit">ออก</button>
      <span class="grow"></span>
      <button id="activate" class="primary">เริ่มใช้งาน</button>
    </div>
  </div>
  <script src="license.js"></script>
</body>
</html>
